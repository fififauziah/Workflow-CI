name: CI - Loan Prediction Model Training

on:
  push:
    branches:
      - main
    paths:
      - 'MLProject/**'
  pull_request:
    branches:
      - main
    paths:
      - 'MLProject/**'
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Number of trees in Random Forest'
        required: false
        default: '100'
      max_depth:
        description: 'Max depth of trees (use "None" for unlimited)'
        required: false
        default: 'None'

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/loan-prediction-model

permissions:
  contents: write

jobs:
  train:
    name: Train Model & Save Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      - name: Run MLflow Project (training)
        env:
          MLFLOW_TRACKING_URI: mlruns
          MLFLOW_EXPERIMENT_NAME: Loan Prediction Tuning
        run: |
          cd MLProject
          mlflow run . \
            --env-manager=local \
            -P data_path=loan_preprocessed.csv \
            -P n_estimators=${{ github.event.inputs.n_estimators || '100' }} \
            -P max_depth=${{ github.event.inputs.max_depth || 'None' }}

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs-${{ github.run_number }}
          path: MLProject/mlruns/
          retention-days: 30

      - name: Upload confusion matrix
        uses: actions/upload-artifact@v4
        with:
          name: confusion-matrix-${{ github.run_number }}
          path: MLProject/confusion_matrix.png
          retention-days: 30

      - name: Commit mlruns to repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/mlruns/ || true
          git add MLProject/confusion_matrix.png || true
          git diff --staged --quiet || (
            git commit -m "ci: save mlruns from run #${{ github.run_number }} [skip ci]" &&
            git pull --rebase origin main &&
            git push origin main
          )

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Dockerfile
        run: |
          printf 'FROM python:3.10-slim\nWORKDIR /app\nRUN apt-get update && apt-get install -y --no-install-recommends gcc && rm -rf /var/lib/apt/lists/*\nCOPY MLProject/requirements.txt ./requirements.txt\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY MLProject/modelling.py ./modelling.py\nCOPY MLProject/loan_preprocessed.csv ./loan_preprocessed.csv\nENV MLFLOW_TRACKING_URI=mlruns\nENV MLFLOW_EXPERIMENT_NAME="Loan Prediction Tuning"\nENV DATA_PATH=loan_preprocessed.csv\nENV N_ESTIMATORS=100\nENV MAX_DEPTH=None\nCMD ["python", "modelling.py"]\n' > Dockerfile
          echo "=== ISI DOCKERFILE ==="
          cat Dockerfile

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:run-${{ github.run_number }}

      - name: Docker Hub image URL
        run: |
          echo "✅ Docker image pushed:"
          echo "   https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/loan-prediction-model"
